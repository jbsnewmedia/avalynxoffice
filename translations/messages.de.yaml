help.contacts.title: "Kontakte"
help.contacts.groups: "Gruppen"
help.contacts.groups_description: "Kontakte sind alphabetisch von A bis Z gruppiert; „Other“ sammelt Einträge ohne passenden Anfangsbuchstaben. „Alle“ zeigt das gesamte Adressbuch."
help.contacts.search: "Suche"
help.contacts.search_description: "Das Suchfeld filtert Kontakte direkt auf dem Server – auch in großen Adressbüchern. Der Kontofilter schränkt die Anzeige auf ein Konto ein."
help.contacts.detail: "Details"
help.contacts.detail_description: "Ein Klick auf einen Kontakt zeigt alle gespeicherten Informationen: E-Mail-Adresse, Firma und Telefonnummern (geschäftlich, mobil, privat)."
help.contacts.new: "Anlegen & Bearbeiten"
help.contacts.new_description: "Neue Kontakte erstellen Sie über den Button „Neuer Kontakt“; bestehende lassen sich bearbeiten und entfernen."
help.contacts.sync: "Synchronisation"
help.contacts.sync_description: "Bei angebundenen Exchange-Postfächern werden Kontakte vom Server synchronisiert und gelten in AvalynxOffice als schreibgeschützt – Änderungen nehmen Sie im Exchange/Outlook vor."

help.calendar.title: "Kalender"
help.calendar.views: "Ansichten"
help.calendar.views_description: "Der Kalender bietet Tag, Woche, Monat und Liste – umschalten über das Auswahlmenü in der Werkzeugleiste. Mit den Pfeilen blättern Sie vor und zurück, „Heute“ springt zum aktuellen Tag."
help.calendar.all: "Alle Termine"
help.calendar.all_description: "„Alle Termine“ zeigt Termine übergreifend an, ohne feste Monats- oder Wochenauswahl."
help.calendar.search: "Suche"
help.calendar.search_description: "In der Listenansicht durchsucht das Suchfeld die Termine direkt auf dem Server."
help.calendar.new: "Termine anlegen"
help.calendar.new_description: "„Neuer Termin“ (oder das Plus-Symbol an einem Tag) öffnet das Formular: Titel, Beginn und Ende, ganztägig, Ort, Beschreibung sowie Wiederholung (täglich, wöchentlich, monatlich, jährlich)."
help.calendar.detail: "Termin-Details"
help.calendar.detail_description: "Ein Klick auf einen Termin zeigt alle Details und erlaubt Änderungen."

help.profile.title: "Profil & Sicherheit"
help.profile.overview: "Übersicht"
help.profile.overview_description: "„Profil“ zeigt Ihre E-Mail-Adresse und Ihre Rollen in der Instanz."
help.profile.recovery: "Wiederherstellungsadressen"
help.profile.recovery_description: "Höchstens 2 externe E-Mail-Adressen, über die Sie Ihr Passwort selbst zurücksetzen können, wenn Sie es vergessen haben. Jede neue Adresse wird über den Link in der Bestätigungsmail freigeschaltet."
help.profile.app_passwords: "App-Passwörter"
help.profile.app_passwords_description: "Erlauben einzelnen Geräten und Apps (z. B. Outlook oder ein ActiveSync-Handy) den Mailabruf, ohne Ihr Haupt-Passwort dort zu hinterlegen. Ein App-Passwort wird nur direkt nach dem Anlegen einmalig angezeigt und lässt sich jederzeit einzeln widerrufen."
help.profile.sessions: "Sitzungen"
help.profile.sessions_description: "Alle aktiven Anmeldungen mit Gerät, Ort, IP-Adresse und letzter Aktivität. Sie können einzelne Sitzungen oder alle anderen gleichzeitig beenden – praktisch, wenn ein Gerät verloren gegangen ist."
help.profile.password_reset: "Passwort vergessen"
help.profile.password_reset_description: "Über „Passwort wiederherstellen“ schicken Sie sich selbst einen Code an eine hinterlegte Wiederherstellungsadresse. Alternativ kann ein Administrator einen Reset anstoßen."

help.settings.title: "Einstellungen"
help.settings.language: "Sprache"
help.settings.language_description: "Umschalten zwischen Deutsch und English – wirksam sofort."
help.settings.design: "Design"
help.settings.design_description: "Hell, Dunkel oder Automatisch (folgt der Geräteeinstellung); die Wahl wird pro Browser gespeichert. Die Primärfarbe der Oberfläche legen Sie per Farbwähler oder HEX-Code fest."
help.settings.time: "Zeitanzeige"
help.settings.time_description: "Zeitzone (oder UTC-Systemstandard) und Uhrzeitformat wählen: kurz, mit Sekunden oder mit Sekunden und Uhr-Symbol."

help.admin.title: "Administrator-Bereich"
help.admin.intro_description: "Nur für Benutzer mit der Rolle Administrator sichtbar; erreichbar über das Benutzer-Menü (⋮) → „Administrator“."
help.admin.dashboard: "Übersicht"
help.admin.dashboard_description: "Einstiegsseite des Administrator-Bereichs."
help.admin.users: "Benutzer"
help.admin.users_description: "Benutzerkonten anlegen, Rollen vergeben, Daten pflegen und Passwort-Resets anstoßen."
help.admin.accounts: "Konten"
help.admin.accounts_description: "E-Mail-Konten mit Aliasen und Ordnern verwalten: Namen, Sortierung und Funktionen (Posteingang, Papierkorb, Entwürfe …)."
help.admin.connectors: "Connectoren"
help.admin.connectors_description: "Anbindung an die Mailserver einrichten – Exchange/EWS oder POP3/SMTP – inklusive Plugin-Einstellungen."
help.admin.password_resets: "Passwort-Zurücksetzungen"
help.admin.password_resets_description: "Resets für Benutzer anstoßen und nach Identitätsprüfung freigeben."
help.admin.legal: "Rechtliches"
help.admin.legal_description: "Impressum und Datenschutz in der integrierten Textbearbeitung pflegen."
help.admin.license: "Lizenz"
help.admin.license_description: "Lizenzschlüssel verwalten. Ohne Lizenz läuft die Instanz schreibgeschützt."
help.admin.backup: "Backup"
help.admin.backup_description: "Zeitplan einrichten, manuelle Backups erstellen, herunterladen, wiederherstellen oder löschen – inklusive Datei-Upload für Rücksicherungen."
help.admin.system: "System"
help.admin.system_description: "Status und Gesundheit aller Connectoren prüfen und Systemeinstellungen speichern."

help.faq.title: "FAQ"
help.faq.question1: "Warum sehe ich keine Bilder in E-Mails?"
help.faq.answer1: "Externe Bilder werden aus Datenschutzgründen blockiert – so verhindern Sie ungewolltes Nachverfolgen (Tracking-Pixel). Über „Externe Inhalte laden“ in der geöffneten Mail laden Sie sie gezielt nach."
help.faq.question2: "Ich habe mein Passwort vergessen. Was tun?"
help.faq.answer2: "Auf der Login-Seite „Passwort wiederherstellen“ wählen und sich einen Code an eine hinterlegte Wiederherstellungsadresse schicken lassen. Ohne Wiederherstellungsadresse wenden Sie sich an Ihre Administratorin oder Ihren Administrator."
help.faq.question3: "Warum kann ich keine Mails senden oder ändern?"
help.faq.answer3: "Ohne gültige Lizenz läuft AvalynxOffice im Nur-Lesen-Modus. Ein Administrator kann unter Administrator → Lizenz einen Schlüssel hinterlegen."
help.faq.question4: "Warum kann ich meine Kontakte nicht bearbeiten?"
help.faq.answer4: "Bei Exchange-Anbindungen werden Kontakte vom Postfach synchronisiert und sind in AvalynxOffice schreibgeschützt. Änderungen nehmen Sie direkt in Exchange/Outlook vor – sie erscheinen danach automatisch hier."
help.faq.question5: "Wie verbinde ich Outlook oder mein Handy mit AvalynxOffice?"
help.faq.answer5: "Legen Sie unter Profil → App-Passwörter ein App-Passwort an und verwenden Sie es auf dem Gerät (z. B. via Exchange ActiveSync). Ihr normales Web-Passwort wird von Geräten nicht akzeptiert."
help.faq.question6: "Wo sind gelöschte Mails?"
help.faq.answer6: "Gelöschte Mails landen im Papierkorb-Ordner des jeweiligen Kontos. Sie lassen sich wiederherstellen, indem Sie sie von dort in einen anderen Ordner verschieben."
help.faq.question7: "Die Mail-Suche findet eine ältere Mail nicht."
help.faq.answer7: "Die Suche filtert die bereits geladenen Mails. Scrollen Sie weiter nach unten, damit ältere Mails nachgeladen werden, oder wechseln Sie in einen passenden Ordner und suchen Sie dort."
help.faq.question8: "Wie stelle ich den dunklen Modus dauerhaft ein?"
help.faq.answer8: "Unter Einstellungen → Design auf „Dunkel“ (oder „Automatisch“ – dann folgt AvalynxOffice der Geräte-Einstellung). Die Einstellung gilt pro Browser und bleibt erhalten."

