help.mail.title: "E-Mails"
help.mail.layout: "Ansicht"
help.mail.layout_description: "Drei Spalten: links Konten und Ordner, in der Mitte die Mail-Liste, rechts die geöffnete E-Mail. Auf kleinen Bildschirmen blenden Sie die Spalten über die Schalter in der Kopfzeile ein."
help.mail.accounts: "Konten"
help.mail.accounts_description: "Wählen Sie ein Konto, um dessen Ordner zu sehen, oder „Alle Konten“ für die Mails aller Konten gemeinsam. Das Kontomenü enthält eine eigene Sofortsuche."
help.mail.folders: "Ordner"
help.mail.folders_description: "„Alle Mails“ fasst alle Ordner eines Kontos zusammen. Die Zahl am Ordner zählt die ungelesenen Mails und aktualisiert sich automatisch. Papierkorb, Entwürfe und geplante Mails sind eigene Ordner."
help.mail.list: "Liste"
help.mail.list_description: "Jeder Eintrag zeigt Absender, Betreff, Vorschautext und Datum sowie Symbole für Status und Besonderheiten (siehe Abschnitt Symbole). Scrollen Sie ans Ende, lädt die Liste automatisch weitere Mails nach."
help.mail.search: "Suche"
help.mail.search_description: "Das Suchfeld über der Liste filtert die geladenen Mails live nach Absender, Betreff und Inhalt. Enter wendet den Filter an, Esc leert das Feld."
help.mail.read: "Lesen"
help.mail.read_description: "Eine geöffnete Mail zeigt Absender, Empfänger (Von/An/CC/BCC), Datum und Inhalt. Aufgeklappte Details zeigen alle Kopfzeilen-Informationen."
help.mail.external: "Externe Inhalte"
help.mail.external_description: "Externe Bilder in HTML-Mails werden zum Schutz Ihrer Privatsphäre blockiert (z. B. Tracking-Pixel). Über „Externe Inhalte laden“ laden Sie sie gezielt für diese eine Mail nach."
help.mail.attachments: "Anhänge"
help.mail.attachments_description: "Anhänge erscheinen unter dem Inhalt als Chips mit Typ-Symbol und Dateigröße; das Download-Symbol speichert den Anhang."
help.mail.actions: "Aktionen"
help.mail.actions_description: "Antworten, Allen antworten, Weiterleiten, Bearbeiten (bei Entwürfen), Verschieben, Als Spam markieren, Drucken und Gelesen/Ungelesen. Bei wenig Platz sammelt sich alles unter dem Drei-Punkte-Menü."
help.mail.move: "Verschieben & Löschen"
help.mail.move_description: "„Verschieben“ öffnet eine Ordnerauswahl – oder ziehen Sie die Mail in der Liste einfach per Drag & Drop auf den Zielordner. „Löschen“ verschiebt nach einer Sicherheitsabfrage in den Papierkorb; von dort lässt sich die Mail zurückschieben."
help.mail.read_unread: "Gelesen/Ungelesen"
help.mail.read_unread_description: "Doppelklick (oder der Briefumschlag-Button) schaltet eine Mail zwischen gelesen und ungelesen um. Nach dem Lesen springt die Ansicht automatisch zur nächsten ungelesenen Mail."
help.mail.compose: "Schreiben"
help.mail.compose_description: "Der Stift-Button öffnet das Verfassen-Fenster. Empfänger vervollständigen sich automatisch aus Ihren Kontakten; mehrere Adressen trennen Sie mit Komma oder Semikolon. CC, BCC und „Antwort an“ finden Sie unter „Erweitert“."
help.mail.compose_richtext: "Formatierungen"
help.mail.compose_richtext_description: "Der Editor unterstützt fett, kursiv, Listen, Farben und mehr – Empfänger erhalten eine HTML-Mail."
help.mail.compose_attachments: "Anhänge hinzufügen"
help.mail.compose_attachments_description: "Anhänge über die Büroklammer auswählen oder per Drag & Drop in die Ablagezone ziehen. Bereits hochgeladene Anhänge bleiben beim Weiterbearbeiten erhalten."
help.mail.compose_schedule: "Später senden"
help.mail.compose_schedule_description: "Mit dem Schalter „Geplanten Versand aktivieren“ legen Sie Datum und Uhrzeit fest. Die Mail wird als „geplant“ markiert und zum gewählten Zeitpunkt verschickt."
help.mail.compose_drafts: "Entwürfe"
help.mail.compose_drafts_description: "„Als Entwurf speichern“ legt eine unfertige Mail in den Entwürfe-Ordner; über „Bearbeiten“ öffnen und senden Sie sie später. Beim Schließen mit ungespeicherten Änderungen fragt AvalynxOffice nach: speichern, verwerfen oder abbrechen."
help.mail.print: "Drucken"
help.mail.print_description: "Die Druckansicht zeigt eine Mail ohne Bedien-Oberfläche; gedruckt wird mit Strg+P (bzw. Cmd+P)."
help.mail.license: "Nur-Lesen-Modus"
help.mail.license_description: "Ohne gültige Lizenz läuft AvalynxOffice schreibgeschützt: Ändernde Aktionen sind gesperrt (Schloss-Symbol)."

