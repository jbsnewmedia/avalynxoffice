services:
    _defaults:
        autowire: true
        autoconfigure: true

    JBSNewMedia\Pop3ConnectorBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../Pop3ConnectorBundle.php'

    JBSNewMedia\Pop3ConnectorBundle\Plugin\Pop3ConnectorPlugin:
        tags: ['avalynxoffice.connector_plugin']

    JBSNewMedia\Pop3ConnectorBundle\Service\Pop3Fetcher:
        arguments:
            $mailDumpDir: '%app.mail_dump_dir%'
            $mailDumpRetentionDays: '%app.mail_dump_retention_days%'
