services:
    _defaults:
        autowire: true
        autoconfigure: true

    JBSNewMedia\ExchangeConnectorBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../ExchangeConnectorBundle.php'

    JBSNewMedia\ExchangeConnectorBundle\Plugin\ExchangeConnectorPlugin:
        tags: ['avalynxoffice.connector_plugin']

    JBSNewMedia\ExchangeConnectorBundle\Service\RawMailImporter:
        arguments:
            $mailDumpDir: '%app.mail_dump_dir%'
            $mailDumpRetentionDays: '%app.mail_dump_retention_days%'
