services:
    _defaults:
        autowire: true
        autoconfigure: true

    JBSNewMedia\MailActionBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../Model/'
            - '../../Contract/'
            - '../../Twig/'

    JBSNewMedia\MailActionBundle\Registry\ComposeButtonRegistry: ~
    JBSNewMedia\MailActionBundle\Registry\EmailActionRegistry: ~
    JBSNewMedia\MailActionBundle\Registry\ContactActionRegistry: ~
    JBSNewMedia\MailActionBundle\Registry\CalendarActionRegistry: ~
    JBSNewMedia\MailActionBundle\Plugin\DefaultComposeButtonPlugin:
        tags:
            -
                name: !php/const JBSNewMedia\MailActionBundle\DependencyInjection\MailActionTags::COMPOSE_BUTTON
                id: 'mail.compose.default_new_email'
                priority: 0
                position: 100

    JBSNewMedia\MailActionBundle\Plugin\EmailAction\EmailToggleReadActionPlugin:
        tags:
