security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: AvalynxOffice\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: AvalynxOffice\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: /mails
                enable_csrf: true
            remember_me:
                secret: '%env(APP_SECRET)%'
                lifetime: 1209600 # 14 days
                path: /
                secure: auto
                samesite: lax
                token_provider:
                    doctrine: true
            login_throttling:
                max_attempts: 5
            logout:
                path: app_logout
                target: /login
    access_control:
        - { path: ^/(login|logout)$, roles: PUBLIC_ACCESS }
        - { path: ^/(impressum|datenschutz|agb)$, roles: PUBLIC_ACCESS }
        - { path: ^/profile/password-reset, roles: PUBLIC_ACCESS }
        - { path: ^/profile/recovery/verify/, roles: PUBLIC_ACCESS }
        - { path: ^/locale, roles: PUBLIC_ACCESS }
        - { path: ^/(css|js|images|build|assets), roles: PUBLIC_ACCESS }
        - { path: ^/(_(profiler|wdt)), roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
