doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        types:
            # Portable RFC-9562 strings on every platform (see the class):
            # the Symfony bridge's BINARY(16) storage on MariaDB/MySQL breaks
            # queries that bind UUIDs without an explicit DBAL type.
            uuid: AvalynxOffice\Db\Type\UuidType

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        enable_native_lazy_objects: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
            Doctrine\DBAL\Platforms\AbstractMySQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'AvalynxOffice\Entity'
                alias: AvalynxOffice
            Licensing:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Licensing/Entity'
                prefix: 'AvalynxOffice\Licensing\Entity'
                alias: Licensing
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            # dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
