# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    AvalynxOffice\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    AvalynxOffice\Service\PluginManifestService:
        bind:
            $projectDir: '%kernel.project_dir%'

    AvalynxOffice\Licensing\Security\TrustedPublicKeyProvider:
        arguments:
            $publicKeysJson: '%env(string:AVALYNXOFFICE_LICENSE_PUBLIC_KEYS)%'

    AvalynxOffice\Licensing\Provider\EnvLicenseKeyProvider:
        arguments:
            $keys: '%env(string:AVALYNXOFFICE_LICENSE_KEYS)%'

    AvalynxOffice\Licensing\Provider\FileLicenseKeyProvider:
        arguments:
            $filePath: '%env(string:AVALYNXOFFICE_LICENSE_FILE)%'

    AvalynxOffice\Licensing\Service\LicenseValidator:
        arguments: ~

    AvalynxOffice\Licensing\Service\LicenseManager:
        arguments:
            $configuredOrganizationId: '%env(string:AVALYNXOFFICE_ORGANIZATION_ID)%'

    AvalynxOffice\Licensing\Service\UserSeatCounter:
        arguments:
            $userRepository: '@AvalynxOffice\Repository\UserRepository'

    AvalynxOffice\Service\Mail\EmailDetailTemplateResolver:
        arguments:
            $pluginLocator: !service_locator
                JBSNewMedia\MailViewBundle\View\EmailDetailTemplateProvider: '@?JBSNewMedia\MailViewBundle\View\EmailDetailTemplateProvider'

    AvalynxOffice\Service\Mail\AttachmentStorage:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $storageDir: '%env(string:ATTACHMENT_STORAGE_DIR)%'
            $segmentLength: '%env(int:ATTACHMENT_STORAGE_SEGMENT_LENGTH)%'
            $segmentDepth: '%env(int:ATTACHMENT_STORAGE_SEGMENT_DEPTH)%'
            $maxBytes: '%env(int:ATTACHMENT_STORAGE_MAX_BYTES)%'

    AvalynxOffice\Twig\AppExtension:
        arguments:
            $pluginLocator: !service_locator
                JBSNewMedia\MailActionBundle\Registry\ComposeButtonRegistry: '@?JBSNewMedia\MailActionBundle\Registry\ComposeButtonRegistry'
                JBSNewMedia\MailActionBundle\Registry\EmailActionRegistry: '@?JBSNewMedia\MailActionBundle\Registry\EmailActionRegistry'
                JBSNewMedia\MailActionBundle\Registry\ContactActionRegistry: '@?JBSNewMedia\MailActionBundle\Registry\ContactActionRegistry'
                JBSNewMedia\MailActionBundle\Registry\CalendarActionRegistry: '@?JBSNewMedia\MailActionBundle\Registry\CalendarActionRegistry'
