# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # GeoIP lookups of login IPs call the external ip-api.com service over
    # plain HTTP (the free tier offers no HTTPS) and are therefore opt-in.
    env(AVALYNXOFFICE_GEOIP_ENABLED): 'false'
    # Raw mail dumps (success/pending/error copies written by the connector
    # plugins) live below var/ by default; files older than the retention
    # (days, 0 disables pruning) are removed when a new dump is written.
    env(AVALYNXOFFICE_MAIL_DUMP_DIR): '%kernel.project_dir%/var/mail_dumps'
    env(AVALYNXOFFICE_MAIL_DUMP_RETENTION_DAYS): '14'
    app.mail_dump_dir: '%env(resolve:AVALYNXOFFICE_MAIL_DUMP_DIR)%'
    app.mail_dump_retention_days: '%env(int:AVALYNXOFFICE_MAIL_DUMP_RETENTION_DAYS)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    AvalynxOffice\:
        resource: '../src/'
        exclude:
            - '../src/DataFixtures/'
            - '../src/Factory/'
            - '../src/Story/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    AvalynxOffice\Service\ConnectorPluginRegistry:
        arguments:
            $plugins: !tagged_iterator avalynxoffice.connector_plugin

    AvalynxOffice\Service\Security\SecretCrypto:
        arguments:
            $encryptionKey: '%env(string:AVALYNXOFFICE_ENCRYPTION_KEY)%'

    AvalynxOffice\Service\PluginManifestService:
        bind:
            $projectDir: '%kernel.project_dir%'

    AvalynxOffice\Service\Login\GeoIpLookupService:
        arguments:
            $enabled: '%env(bool:AVALYNXOFFICE_GEOIP_ENABLED)%'

    AvalynxOffice\Service\LegalContentService:
        arguments:
            $legalSanitizer: '@html_sanitizer.sanitizer.legal'

    AvalynxOffice\Service\UserService:
        arguments:
            $systemMailer: '@mailer'
            $systemMailerFromAddress: '%env(string:MAILER_FROM)%'
            $uriSigner: '@uri_signer'

    AvalynxOffice\Licensing\Security\TrustedPublicKeyProvider:
        arguments:
            $publicKeysJson: '%env(string:AVALYNXOFFICE_LICENSE_PUBLIC_KEYS)%'

    AvalynxOffice\Licensing\Provider\EnvLicenseKeyProvider:
        arguments:
            $keys: '%env(string:AVALYNXOFFICE_LICENSE_KEYS)%'

    AvalynxOffice\Licensing\Provider\FileLicenseKeyProvider:
        arguments:
            $filePath: '%env(string:AVALYNXOFFICE_LICENSE_FILE)%'

    AvalynxOffice\Licensing\Service\LicenseValidator:
        arguments: ~

    AvalynxOffice\Licensing\Service\LicenseManager:
        arguments:
            $configuredOrganizationId: '%env(string:AVALYNXOFFICE_ORGANIZATION_ID)%'

    AvalynxOffice\Licensing\Service\UserSeatCounter:
        arguments:
            $userRepository: '@AvalynxOffice\Repository\UserRepository'

    AvalynxOffice\Service\Mail\EmailDetailTemplateResolver:
        arguments:
            $pluginLocator: !service_locator
                JBSNewMedia\MailViewBundle\View\EmailDetailTemplateProvider: '@?JBSNewMedia\MailViewBundle\View\EmailDetailTemplateProvider'

    AvalynxOffice\Service\Mail\AttachmentStorage:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $storageDir: '%env(string:ATTACHMENT_STORAGE_DIR)%'
            $segmentLength: '%env(int:ATTACHMENT_STORAGE_SEGMENT_LENGTH)%'
            $segmentDepth: '%env(int:ATTACHMENT_STORAGE_SEGMENT_DEPTH)%'
            $maxBytes: '%env(int:ATTACHMENT_STORAGE_MAX_BYTES)%'

    AvalynxOffice\Twig\UserDateTimeExtension: ~

    AvalynxOffice\EventSubscriber\UserTimezoneSubscriber:
        arguments:
            $twig: '@twig'

    AvalynxOffice\Twig\AppExtension:
        arguments:
            $pluginLocator: !service_locator
                JBSNewMedia\MailActionBundle\Registry\ComposeButtonRegistry: '@?JBSNewMedia\MailActionBundle\Registry\ComposeButtonRegistry'
                JBSNewMedia\MailActionBundle\Registry\EmailActionRegistry: '@?JBSNewMedia\MailActionBundle\Registry\EmailActionRegistry'
                JBSNewMedia\MailActionBundle\Registry\ContactActionRegistry: '@?JBSNewMedia\MailActionBundle\Registry\ContactActionRegistry'
                JBSNewMedia\MailActionBundle\Registry\CalendarActionRegistry: '@?JBSNewMedia\MailActionBundle\Registry\CalendarActionRegistry'

# Fixtures, factories and stories depend on dev-only packages (fixtures-bundle,
# foundry, faker) and must not be compiled into the prod container.
when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        AvalynxOffice\DataFixtures\:
            resource: '../src/DataFixtures/'
        AvalynxOffice\Factory\:
            resource: '../src/Factory/'
        AvalynxOffice\Story\:
            resource: '../src/Story/'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        AvalynxOffice\DataFixtures\:
            resource: '../src/DataFixtures/'
            public: true
        AvalynxOffice\Factory\:
            resource: '../src/Factory/'
        AvalynxOffice\Story\:
            resource: '../src/Story/'
