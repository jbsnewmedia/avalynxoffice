name: release

on:
    release:
        types:
            - published
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Build the packages and upload them as artifacts instead of attaching them to a release.'
                type: boolean
                default: true

permissions:
    contents: write

jobs:
    package:
        runs-on: ubuntu-24.04

        env:
            # Copy path repository packages (plugins/*) instead of symlinking
            # them, so the shipped vendor directory is self-contained.
            COMPOSER_MIRROR_PATH_REPOS: '1'

        steps:
            -   uses: actions/checkout@v6
                with:
                    ref: ${{ github.event.release.tag_name || github.ref }}

            -   name: Determine version
                id: version
                run: |
                    if [ "${{ github.event_name }}" = "release" ]; then
                        echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
                    else
                        echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: sodium, intl, mbstring
                    coverage: none

            -   name: Install dependencies
                run: composer install --no-dev --prefer-dist --no-interaction --no-progress

            -   name: Build runtime artifacts
                env:
                    APP_ENV: prod
                    APP_SECRET: release-build-placeholder
                run: |
                    php bin/console assets:install public --no-debug
                    php bin/console assets:scss-compile --no-debug
                    php bin/console assets:css-purge --no-debug
                    php bin/console app:plugin:manifest --no-debug

            -   name: Assemble package
                run: |
                    VERSION="${{ steps.version.outputs.version }}"
                    mkdir -p "dist/avalynxoffice-$VERSION"
                    for item in assets bin config migrations plugins public src templates translations vendor .env composer.json composer.lock symfony.lock; do
                        cp -rL "$item" "dist/avalynxoffice-$VERSION/"
                    done

            -   name: Create archives
                run: |
                    VERSION="${{ steps.version.outputs.version }}"
                    cd dist
                    zip -rq "avalynxoffice-$VERSION.zip" "avalynxoffice-$VERSION"
                    tar czf "avalynxoffice-$VERSION.tar.gz" "avalynxoffice-$VERSION"
                    sha256sum "avalynxoffice-$VERSION.zip" "avalynxoffice-$VERSION.tar.gz" > "avalynxoffice-$VERSION.sha256"

            -   name: Attach to release
                if: github.event_name == 'release'
                env:
                    GH_TOKEN: ${{ github.token }}
                run: gh release upload "${{ github.event.release.tag_name }}" "dist/avalynxoffice-${{ steps.version.outputs.version }}.zip" "dist/avalynxoffice-${{ steps.version.outputs.version }}.tar.gz" "dist/avalynxoffice-${{ steps.version.outputs.version }}.sha256" --clobber

            -   name: Upload artifact (dry run)
                if: github.event_name != 'release'
                uses: actions/upload-artifact@v4
                with:
                    name: avalynxoffice-${{ steps.version.outputs.version }}
                    path: dist/*
